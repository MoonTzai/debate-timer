<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>教练记录计时器</title>
<style>
:root{--bg:#0d0d0d;--card:#141414;--border:#222;--input-bg:#1a1a1a;--gold:#ffc000;--text:#eee;--gray:#999;--dark-gray:#555;--blue:#4fa8ee;--green:#6ecd71;--red:#ee5555;--radius:8px;--radius-sm:6px}
body.light{--bg:#f5f5f5;--card:#fff;--border:#e0e0e0;--input-bg:#f0f0f0;--gold:#4f6bed;--text:#222;--gray:#666;--dark-gray:#999;--blue:#4f6bed;--green:#4caf50;--red:#e53935}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Microsoft YaHei','PingFang SC',sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:var(--card);padding:14px 24px 14px 80px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative}
header h1{font-size:30px;line-height:1.15;color:var(--gold);position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
header h1{max-width:52%;overflow:hidden;text-overflow:ellipsis}
header h1{max-width:52%;overflow:hidden;text-overflow:ellipsis}
header h1{max-width:52%;overflow:hidden;text-overflow:ellipsis}
header h1{max-width:52%;overflow:hidden;text-overflow:ellipsis}
.home-btn{position:absolute;left:20px}
main{flex:1;overflow-y:auto;padding:20px;max-width:920px;margin:0 auto;width:100%}
.step-bar{display:flex;align-items:center;justify-content:center;gap:6px;margin:16px 0 20px;flex-wrap:wrap;font-size:13px}
.step-bar .dot{width:10px;height:10px;border-radius:50%;background:var(--border);flex-shrink:0}
.step-bar .dot.done{background:var(--green)}.step-bar .dot.current{background:var(--gold)}
.step-bar .sep{color:var(--dark-gray);font-size:11px}.step-bar .label{color:var(--gray);font-size:12px}
.step-bar .label.current{color:var(--gold);font-weight:bold}.step-bar .label.done{color:var(--green)}
.round-name-center{text-align:center;font-size:18px;color:var(--gold);font-weight:bold;margin-bottom:20px}
.start-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:24px}
.start-wrap .logo{font-size:36px}.start-wrap h2{color:var(--gold);font-size:22px}
.start-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.btn{background:var(--card);color:var(--gray);border:1px solid var(--border);padding:10px 20px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-family:inherit;transition:all .15s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--on-accent);border:none;font-weight:bold}.btn.gold:hover{opacity:.85}
body.light .btn.gold{color:var(--on-accent)}
.btn-sm{background:var(--card);border:1px solid var(--border);color:var(--gray);padding:10px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:inherit}
.btn-sm:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm.danger{color:var(--red);border-color:transparent}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h3{color:var(--gold);font-size:15px;margin:0 0 8px 0;border-bottom:1px solid var(--border);padding-bottom:6px}
.row-inp{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.row-inp label{color:var(--gray);font-size:12px;width:96px;min-width:96px;padding-top:9px;flex-shrink:0}
.row-inp input,.row-inp textarea,.row-inp select{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none}
.row-inp textarea{min-height:72px;resize:vertical;width:100%;word-wrap:break-word;white-space:pre-wrap}
.row-inp input:focus,.row-inp textarea:focus,.row-inp select:focus{border-color:var(--gold)}
.row-inp .time-inp{flex:0 0 auto;width:52px;text-align:center}
select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none}
.round-config{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:10px 14px;background:var(--input-bg);border-radius:var(--radius-sm);font-size:13px}
.round-config select{min-width:80px}.round-config input{width:48px;text-align:center}
.timer-display{text-align:center;padding:20px;background:var(--bg);border-radius:var(--radius);margin-bottom:16px}
.timer-display .time{font-size:64px;font-weight:bold;color:var(--gold);font-family:'Consolas',monospace}
.timer-display .time.warn{color:var(--red)}.timer-display .time.paused{opacity:.5}
.timer-display .label{font-size:14px;color:var(--gray);margin-top:4px}
.timer-ctrl{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.timer-dual{display:flex;gap:4px;justify-content:center}
.timer-dual>div{flex:1;text-align:center;padding:16px 8px;border-radius:var(--radius);cursor:pointer;border:2px solid transparent}
.timer-dual>div.active{background:var(--input-bg);border-color:var(--gold)}
.timer-dual .time{font-size:min(9vw,64px);font-weight:bold;color:var(--gold);font-family:'Consolas',monospace;line-height:1;white-space:nowrap}
.timer-dual .time.warn{color:var(--red)}
.side-divider{border:none;border-top:2px dashed var(--border);margin:16px 0}
.summary-box textarea{min-height:100px;font-size:14px;line-height:1.7;width:100%;word-wrap:break-word;white-space:pre-wrap;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);outline:none;padding:8px 12px;font-family:inherit}
.export-group{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:16px}
.export-group h3{color:var(--gold);font-size:14px;margin-bottom:10px}
#footer-bar{padding:12px 20px;border-top:1px solid var(--border);flex-shrink:0;display:flex;justify-content:center;background:var(--card);align-items:center;position:relative;gap:8px;flex-wrap:wrap}
#theme-toggle{background:transparent;border:1px solid var(--border);color:var(--gray);padding:10px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit}
#theme-toggle:hover{border-color:var(--gold);color:var(--gold)}
.hidden{display:none!important}.mt-8{margin-top:8px}.mt-12{margin-top:12px}
.text-sm{font-size:12px}.text-gray{color:var(--gray)}
@media(max-width:600px){
  header{padding:10px 14px;flex-wrap:wrap;gap:6px}.home-btn{position:static;margin-right:auto}header .btn-sm{font-size:11px;padding:6px 8px}#theme-toggle{font-size:11px;padding:6px 8px}header h1{font-size:24px;position:static;transform:none;width:100%;max-width:none;text-align:center;order:5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header span{margin-left:auto}
  main{padding:12px}.card{padding:14px}
  .timer-display .time{font-size:42px}.timer-dual .time{font-size:32px}
  .row-inp{flex-direction:column;gap:4px}.row-inp label{padding-top:0}
  #footer-bar{padding:10px 14px}
}


/* R5: navigation styling resides in existing native CSS, without new style/JS loop. */
header[data-dc-nav]{
 --dc-nav-line:var(--border,var(--line,#d8dee9));
 --dc-nav-bg:var(--card,var(--bg,#fff));--dc-nav-accent:var(--gold,var(--accent,#4f6bed));
 display:grid;grid-template-columns:minmax(55px,1fr) minmax(0,2fr) minmax(55px,1fr);
 align-items:center;gap:8px;min-height:56px;height:auto;
 padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));
}
header[data-dc-nav]>[data-dc-back]{grid-column:1;grid-row:1;justify-self:start;position:static;left:auto;top:auto;transform:none}
header[data-dc-nav]>[data-dc-title]{grid-column:2;grid-row:1;justify-self:center;position:static;inset:auto;transform:none;
 text-align:center;margin:0;min-width:0;max-width:100%;overflow-wrap:anywhere;font-size:clamp(17px,2vw,26px);line-height:1.25}
header[data-dc-nav]>[data-dc-actions]{grid-column:3;grid-row:1;justify-self:end;display:flex;align-items:center;
 justify-content:flex-end;flex-wrap:wrap;gap:6px;margin-left:0}
header[data-dc-nav] [data-dc-back]{min-width:46px;min-height:40px;border:1px solid var(--dc-nav-line);
 background:var(--dc-nav-bg);color:inherit;border-radius:12px;padding:8px 12px;line-height:1.2;
 font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
header[data-dc-nav] button:focus-visible{outline:2px solid var(--dc-nav-accent);outline-offset:2px}
header[data-dc-nav] [data-dc-back]:hover{border-color:var(--dc-nav-accent);box-shadow:0 2px 12px var(--glow,transparent)}
@media(max-width:690px){
 header[data-dc-nav]{grid-template-columns:auto minmax(0,1fr) auto;gap:6px;padding:7px max(9px,env(safe-area-inset-right,0px)) 7px max(9px,env(safe-area-inset-left,0px))}
 header[data-dc-nav]>[data-dc-title]{font-size:clamp(14px,3.5vw,20px)}
 header[data-dc-nav]>[data-dc-actions]{gap:4px}
 header[data-dc-nav]>[data-dc-actions] button{min-height:36px;padding-inline:8px}
 header[data-dc-nav] [data-dc-back]{padding-inline:9px}
}
@media(max-width:430px){
 header[data-dc-nav]:not([data-dc-nav="board"])>[data-dc-title]{grid-column:1/-1;grid-row:2}
 header[data-dc-nav]:not([data-dc-nav="board"])>[data-dc-actions]{grid-column:3;grid-row:1}
}
header[data-dc-nav="board"]{grid-template-columns:auto minmax(100px,1fr) minmax(170px,1.2fr) auto;gap:8px}
header[data-dc-nav="board"]>[data-dc-title]{grid-column:2}
header[data-dc-nav="board"]>.hd-center{grid-column:3;grid-row:1;min-width:0;position:static;transform:none}
header[data-dc-nav="board"]>.hd-right{grid-column:4;grid-row:1}
@media(max-width:1050px){
 header[data-dc-nav="board"]{grid-template-columns:auto minmax(0,1fr) auto}
 header[data-dc-nav="board"]>[data-dc-title]{grid-column:2}
 header[data-dc-nav="board"]>.hd-center{grid-column:1/-1;grid-row:2;justify-self:stretch}
 header[data-dc-nav="board"]>.hd-right{grid-column:3}
}
@media(max-width:600px){
 header[data-dc-nav="board"]{grid-template-columns:auto minmax(0,1fr) auto;row-gap:4px}
 header[data-dc-nav="board"]>[data-dc-title]{grid-column:1/-1;grid-row:2;white-space:normal;justify-self:center}
 header[data-dc-nav="board"]>.hd-center{grid-column:1/-1;grid-row:3;justify-self:stretch}
 header[data-dc-nav="board"]>.hd-right{grid-column:3;grid-row:1}
}
header[data-dc-nav="tendency"]{grid-template-columns:auto minmax(0,1fr) auto auto}
header[data-dc-nav="tendency"]>[data-dc-title]{grid-column:2}
header[data-dc-nav="tendency"]>.spacer{display:none}
header[data-dc-nav="tendency"]>#lang-btn{grid-column:3}
header[data-dc-nav="tendency"]>#hdr-theme{grid-column:4}
header .bar[data-dc-nav="glossary"]{display:flex;flex-wrap:wrap;align-items:center;gap:8px;
 min-height:58px;padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px))}
header .bar[data-dc-nav="glossary"]>[data-dc-back]{min-height:40px;border-radius:12px;padding:8px 11px}
header .bar[data-dc-nav="glossary"]>[data-dc-title]{flex:1;text-align:center;min-width:100px;position:static;transform:none}
header .bar[data-dc-nav="glossary"]>#search{min-width:100px;max-width:210px;flex:1}

invalid inputs, alter report content, commit a project, or inspect prompts.

factory for Atlas/Startrack offline reports. PreparedFile: {blob,name,mime,kind,
owner,lang,nativeLocation:{directory,folder},profile:'ordinary'|'timer'}.

cancelled, share-not-completed, unsupported, failed. A resolved Promise or an
anchor.click does not establish that the destination file was saved.
WEB: iOS HTTPS uses navigator.share({files:[File]}) ONLY, never title/text;
JSON/MD may use text/plain MIME without changing extension. Android Web JSON/MD
share uses byte-identical .json.txt/.md.txt and text/plain regardless of
canShare(original); original extension is retained for downloads. Unsupported
Web Share falls back to a *user-selected* download, not a silent retry. Explicit
cancellation/failure NEVER auto-downloads. Asynchronously prepared exports wait
for a NEW user click before Web Share; no await before navigator.share.
NATIVE: Use existing Capacitor Filesystem -> URI -> Share or test-only LocalSave
(SAF). Write raw Blob bytes in <=256 KiB slices, Base64 encode each slice, await
writeFile then serial appendFile without encoding. Verify raw byte count/stat;
Timer uses partial -> stat -> rename -> URI while ordinary files use the prior
direct target. Preserve original per-module DOCUMENTS/CACHE folder. Do not
decode entire Blob as text, build whole-file Base64, or share partial files.

as JSON (remove only one leading BOM); original module parser/validator commits
or rejects. Genuine Markdown reports (especially Judge) have independent
report import paths; no code-fence extraction or LLM JSON repair.
FILE MATRIX: JSON/MD/TXT/HTML/CSV/SVG keep actual bytes/MIME; XLSX, JPG,
PNG/audio/other binary MUST keep real bytes and extensions, never TXT aliases.

  async function writeNativeBlob(file,session){
    const C=host.Capacitor,FS=C?.Plugins?.Filesystem;
    if(!FS||typeof FS.writeFile!=='function'||typeof FS.appendFile!=='function'||
       typeof FS.stat!=='function'||typeof FS.getUri!=='function')
      throw Error('Native Filesystem byte operations unavailable');
    const loc=file.nativeLocation;
    if(!loc||!['DOCUMENTS','CACHE'].includes(String(loc.directory))||
       !loc.folder||!/^[-\w/]+$/.test(loc.folder))
      throw Error('Missing audited nativeLocation');
    const dir=loc.directory,final=loc.folder.replace(/\/+$/,'')+'/'+file.name;
    const key=dir+':'+final;
    const occupant=held.get(key);
    if(occupant&&occupant!==session)throw Error('This file is being delivered by another session');
    held.set(key,session);
    session.pathKey=key;
    if(session.artifact)return session.artifact;
    const timer=file.profile==='timer',tmp=timer?final+'.partial-'+(++sequence).toString(36):final;
    let written=0;
    try{
      if(timer&&typeof FS.rename!=='function')throw Error('Timer rename unavailable');
      if(file.blob.size===0){
        await FS.writeFile({path:tmp,data:'',directory:dir,recursive:true});
      }else{
        for(let off=0;off<file.blob.size;off+=BUCKET){
          const buf=new Uint8Array(await file.blob.slice(off,Math.min(file.blob.size,off+BUCKET)).arrayBuffer());
          const data=encode64(buf);
          if(off===0)await FS.writeFile({path:tmp,data,directory:dir,recursive:true});
          else await FS.appendFile({path:tmp,data,directory:dir});
          written+=buf.byteLength;
        }
      }
      if(written!==file.blob.size)throw Error('Native chunk size mismatch');
      const stat=await FS.stat({path:tmp,directory:dir});
      if(Number(stat?.size)!==file.blob.size)throw Error('Native stored bytes mismatch');
      if(timer)await FS.rename({from:tmp,to:final,directory:dir,toDirectory:dir});
      const uri=(await FS.getUri({path:final,directory:dir}))?.uri;
      if(!uri)throw Error('Native file URI missing');
      session.artifact={uri,bytes:written,path:final,directory:dir};
      return session.artifact;
    }catch(e){
      if(timer)try{await FS.deleteFile({path:tmp,directory:dir});}catch(_){}
      throw e;
    }
  }
  async function deliver(input,intent='download',options={}){
    let file;
    try{file=prepare(input);}catch(e){return {status:'failed',method:'prepare',message:String(e.message||e),bytes:0};}
    if(!allowed.has(intent))return receipt(file,'unsupported','unknown-intent');
    const cap=capability(file);
    if(!cap.native){
      if(intent==='download')return webDownload(file);
      if(intent==='share')return webShare(file,cap);
      return receipt(file,'unsupported','web-save-location');
    }
    if(intent==='download')return receipt(file,'unsupported','native-download');
    if(intent==='share'&&!cap.share||intent==='save-local'&&!cap.local)
      return receipt(file,'unsupported','native-plugin');
    const session=options.session||{pathKey:null,artifact:null};
    const own=!options.session;
    try{
      const artifact=await writeNativeBlob(file,session);
      if(intent==='share'){
        try{
          await host.Capacitor.Plugins.Share.share({files:[artifact.uri]});
          return receipt(file,'share-returned','native-share',
            {nativeFileWritten:true,nativeUri:artifact.uri});
        }catch(e){return receipt(file,e?.name==='AbortError'?'share-not-completed':'failed','native-share',
          {nativeFileWritten:true,nativeUri:artifact.uri,errorName:e?.name,message:String(e?.message||e)});}
      }
      try{
        const data=await host.Capacitor.Plugins.LocalSave.saveDocument({
          sourceUri:artifact.uri,name:file.name,mimeType:file.mime});
        if(data?.canceled||data?.cancelled)return receipt(file,'cancelled','native-local-save',
          {nativeFileWritten:true,nativeUri:artifact.uri});
        if(data?.saved&&Number(data.bytes)===file.blob.size)
          return receipt(file,'saved','native-local-save',{nativeFileWritten:true,nativeUri:artifact.uri});
        throw Error('Local save did not confirm byte-complete closed stream');
      }catch(e){return receipt(file,e?.name==='AbortError'?'cancelled':'failed','native-local-save',
        {nativeFileWritten:true,nativeUri:artifact.uri,errorName:e?.name,message:String(e?.message||e)});}
    }catch(e){return receipt(file,'failed','native-write',{errorName:e?.name,message:String(e?.message||e)});}
    finally{if(own&&session.pathKey)held.delete(session.pathKey);}
  }
  function present(input,options={}){
    let file;
    try{file=prepare(input);}catch(e){return Promise.resolve({status:'failed',method:'prepare',message:String(e.message||e)});}
    const cap=capability(file);
    if(!cap.mobile&&!cap.native)return deliver(file,'download');
    const doc=host.document;
    if(!doc||!doc.body)return deliver(file,cap.native?'share':'download');
    return new Promise(resolve=>{
      const session={pathKey:null,artifact:null};
      const layer=doc.createElement('div');
      layer.style.cssText='position:fixed;inset:0;z-index:2147483646;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px';
      const box=doc.createElement('div');
      // FILE_IO_ADAPTER: delivery dialog --surface is translucent; choose opaque theme tokens instead.
      box.style.cssText='background:var(--bg1,#fff);color:var(--ink,#222);border-radius:14px;padding:20px;max-width:440px;width:100%;box-shadow:0 20px 60px #0004;display:grid;gap:10px;font:14px/1.5 system-ui,sans-serif';
      const head=doc.createElement('div');head.textContent=say(file,'文件已准备好，请选择交付方式','File ready. Choose a delivery method.');
      head.style.cssText='font-size:17px;font-weight:700';
      const detail=doc.createElement('div');detail.textContent=file.name+' ('+file.blob.size+' bytes)';
      detail.style.cssText='overflow-wrap:anywhere;font-size:12px;opacity:.75';
      const info=doc.createElement('div');info.setAttribute('role','status');info.style.cssText='font-size:13px;min-height:20px;overflow-wrap:anywhere';
      box.append(head,detail);
      let active=false,closed=false,last=null;
      const buttons=[];
      function finish(){
        if(closed)return;
        if(active)return;
        closed=true;layer.remove();
        if(session.pathKey)held.delete(session.pathKey);
        resolve(last||receipt(file,'cancelled','dialog'));
      }
      function add(label,intent){
        const btn=doc.createElement('button');
        btn.type='button';btn.textContent=label;btn.style.cssText='padding:11px;border:1px solid #aaa;border-radius:8px;background:var(--bg0,#f4f6fb);color:inherit;cursor:pointer;font:inherit';
        btn.addEventListener('click',()=>{
          if(intent==='close'){finish();return;}
          if(active)return;active=true;for(const b of buttons)b.disabled=true;
          // Call deliver immediately under user activation, before any await.
          Promise.resolve(deliver(file,intent,{session})).then(r=>{
            last=r;info.textContent=message(r,file)+(r.deliveredName&&r.deliveredName!==file.name?' '+r.deliveredName:'');
            if(typeof options.onReceipt==='function')try{options.onReceipt(r);}catch(_){}
          }).catch(e=>{last=receipt(file,'failed',intent,{message:String(e?.message||e)});info.textContent=message(last,file);})
            .finally(()=>{active=false;for(const b of buttons)b.disabled=false;});
        });
        box.appendChild(btn);buttons.push(btn);return btn;
      }
      if(!cap.native)add(say(file,'下载原文件','Download original file'),'download');
      if(cap.share)add(say(file,cap.androidWeb&&['json','markdown'].includes(file.kind)?'分享TXT兼容副本':'分享文件','Share file'),'share');
      if(cap.local)add(say(file,'另存为（选择文件位置）','Save as (choose location)'),'save-local');
      add(say(file,'完成 / 取消','Done / Cancel'),'close');
      box.appendChild(info);layer.appendChild(box);doc.body.appendChild(layer);
      layer.addEventListener('click',e=>{if(e.target===layer)finish();});
    });
  }
  function openPreview(input) {
    let file;try{file=prepare(input);}catch(e){return {status:'failed',method:'preview',message:String(e.message||e)};}
    try{
      const url=host.URL.createObjectURL(file.blob);
      const w=host.open(url,'_blank');
      host.setTimeout(()=>{try{host.URL.revokeObjectURL(url);}catch(_){}},30000);
      return receipt(file,w?'preview-open-started':'failed','web-preview');
    }catch(e){return receipt(file,'failed','web-preview',{message:String(e.message||e)});}
  }
  function standaloneSource(){
    return '(function(){window.DCFileIO=('+createCoachFileIO.toString()+')(window);})();';
  }
  return Object.freeze({present,deliver,openPreview,standaloneSource,message,capability,
    readJsonText:text=>JSON.parse(String(text).replace(/^\uFEFF/,''))});
}

if(window.Capacitor?.isNativePlatform?.()&&typeof window.Capacitor.registerPlugin==="function") window.Capacitor.registerPlugin("LocalSave");
window.DCFileIO=createCoachFileIO(window);
</script>

    proRemain--;
    var el=document.getElementById('t-main');if(el){el.textContent=fmtTime(proRemain);if(proRemain<=30)el.classList.add('warn');}

  },1000);
}
function runDual(){
